services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fazendados
      POSTGRES_USER: fazendados
      POSTGRES_PASSWORD: fazendados
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fazendados -d fazendados"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://fazendados:fazendados@db:5432/fazendados
      APP_PASSWORD: fazendados
      PORT: 3000
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/db/seed.js && node dist/server/index.js"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
